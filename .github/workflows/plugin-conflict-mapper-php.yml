#
# Promoted from plugin-conflict-mapper/.github/workflows/php.yml (only root
# workflows run in this repo; the vendored copy is upstream history).
name: Plugin Conflict Mapper PHP Composer

on:
  push:
    branches: ["main"]
    paths:
      - 'plugin-conflict-mapper/**'
      - '.github/workflows/plugin-conflict-mapper-php.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'plugin-conflict-mapper/**'
      - '.github/workflows/plugin-conflict-mapper-php.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: plugin-conflict-mapper

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: plugin-conflict-mapper/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
