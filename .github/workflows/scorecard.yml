# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Scorecard

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@1ded685afb366dededa9f372f82fb58cd45f3c7b
    # Reusable called-workflow permissions are CAPPED by the caller's grants;
    # without security-events: write here the scorecard SARIF upload fails with
    # startup_failure (hypatia WF018). id-token: write enables OIDC publish.
    # The reusable's job self-gates on non-pull_request events, so only
    # default-branch publication receives OIDC.
    permissions:
      contents: read
      security-events: write
      id-token: write
