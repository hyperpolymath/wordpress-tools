# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: PMPL-1.0-or-later

[project]
name = "secured"

[[functions]]
name = "attempt"
source = "php-aegis/src/RateLimit/RateLimiter.php"
energy-budget-mj = 10.0
carbon-budget-mg = 2.0

[[functions]]
name = "perMinute"
source = "php-aegis/src/RateLimit/RateLimiter.php"
energy-budget-mj = 5.0
carbon-budget-mg = 1.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
