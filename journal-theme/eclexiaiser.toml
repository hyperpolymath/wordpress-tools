# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: PMPL-1.0-or-later

[project]
name = "journal-theme"

[[functions]]
name = "sinople_setup"
source = "functions.php"
energy-budget-mj = 15.0
carbon-budget-mg = 3.0

[[functions]]
name = "sinople_enforce_image_alt"
source = "inc/accessibility.php"
energy-budget-mj = 5.0
carbon-budget-mg = 1.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
